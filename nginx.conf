server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # 화면이 하나뿐인 앱 — 없는 주소도 index.html 로
    location / {
        try_files $uri $uri/ /index.html;
    }

    # 키 설정 파일은 캐시하지 않음 (컨테이너를 새 키로 켜면 바로 반영)
    location = /config.js {
        add_header Cache-Control "no-store";
    }

    # 빌드된 js·css는 파일 이름에 해시가 붙어 있어 오래 캐시해도 됨
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
    }
}
